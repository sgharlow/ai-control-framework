name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-framework:
    name: Framework validation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validation suite (28 checks)
        run: bash validate-framework.sh

  mcp-server-build:
    name: MCP server build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: ai-framework-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ai-framework-mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build

  installer-smoke:
    name: Installer smoke (npx scaffold)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check, scaffold vs install.sh diff, no-force refusal
        run: bash scripts/installer-smoke.sh

  dashboard-tests:
    name: Dashboard tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx vitest run
